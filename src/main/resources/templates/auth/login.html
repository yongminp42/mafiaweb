<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | MAFIAGAME</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-layout">
  <section class="auth-art" aria-hidden="true">
    <a class="brand light" href="/rooms"><span class="brand-mark">M</span> MAFIA<span>GAME</span></a>
    <div class="art-copy"><p>TRUST NO ONE</p><h1>밤이 오면,<br>진실은 사라진다.</h1><span>♠</span></div>
    <small>© 2026 MAFIAGAME</small>
  </section>
  <section class="auth-content">
    <a class="mobile-brand brand" href="/rooms"><span class="brand-mark">M</span> MAFIA<span>GAME</span></a>
    <div class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h2>다시 만나서 반가워요</h2>
      <p class="subtitle">계정으로 로그인하고 게임에 참여하세요.</p>
      <p class="alert" th:if="${param.error}">이메일 또는 비밀번호를 확인해 주세요.</p>
      <p class="success" th:if="${param.logout}">성공적으로 로그아웃되었습니다.</p>
      <p class="success" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
      <form th:action="@{/login}" method="post">
        <label>이메일<input type="email" name="email" placeholder="name@example.com" autocomplete="username" required></label>
        <label>비밀번호<input type="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required></label>
        <button class="primary" type="submit">로그인</button>
      </form>
      <p class="switch">아직 계정이 없으신가요? <a href="/signup">회원가입</a></p>
    </div>
  </section>
</main>
</body>
</html>
