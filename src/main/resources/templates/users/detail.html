<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${user.nickname} + ' | MAFIAGAME'">유저 프로필 | MAFIAGAME</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container-xl py-3 py-lg-4">
  <header>
    <nav class="navbar py-2" aria-label="주 메뉴">
      <a class="navbar-brand brand d-inline-flex align-items-center gap-2" href="/rooms">
        <span class="brand-mark">M</span>
        <span>MAFIA<span class="brand-game">GAME</span></span>
      </a>
      <div class="navbar-actions d-flex align-items-center gap-3 ms-auto">
        <div class="d-flex align-items-center gap-3">
          <a class="text-secondary small" href="/rooms">게임 로비</a>
          <th:block th:replace="~{fragments/user-menu :: userMenu}"></th:block>
        </div>
      </div>
    </nav>
  </header>

  <a class="btn btn-link text-secondary ps-0 mb-3" href="/rooms">← 게임 로비로</a>

  <section class="app-profile-hero rounded-4 p-4 p-lg-5 d-flex flex-column flex-md-row align-items-md-center gap-4">
    <div class="avatar-large" th:text="${#strings.substring(user.nickname, 0, 1)}">유</div>
    <div class="flex-grow-1">
      <p class="eyebrow">PLAYER PROFILE</p>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <h1 class="h2 fw-bold mb-0" th:text="${user.nickname}">유진</h1>
      </div>
      <p class="text-white-50 mb-1 mt-2" th:text="${user.bio}">마을을 지키는 밤의 추리꾼</p>
      <small class="text-white-50" th:text="${user.joinedAt} + '부터 함께했어요'">2026년 9월 가입부터 함께했어요</small>
    </div>
  </section>

  <section class="row g-3 my-4" aria-label="게임 통계">
    <article class="col-sm-6 col-lg-3">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body d-flex align-items-center gap-3 p-4">
          <span class="stat-icon coral">♠</span>
          <div>
            <small class="d-block text-secondary">총 게임 수</small>
            <strong class="fs-4" th:text="${user.totalGames}">0</strong>
            <em class="text-secondary small ms-1">게임</em>
          </div>
        </div>
      </div>
    </article>
    <article class="col-sm-6 col-lg-3">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body d-flex align-items-center gap-3 p-4">
          <span class="stat-icon mint">★</span>
          <div>
            <small class="d-block text-secondary">승리 횟수</small>
            <strong class="fs-4" th:text="${user.wins}">0</strong>
            <em class="text-secondary small ms-1">승</em>
          </div>
        </div>
      </div>
    </article>
    <article class="col-sm-6 col-lg-3">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body d-flex align-items-center gap-3 p-4">
          <span class="stat-icon purple">♟</span>
          <div>
            <small class="d-block text-secondary">패배 횟수</small>
            <strong class="fs-4" th:text="${user.losses}">0</strong>
            <em class="text-secondary small ms-1">패</em>
          </div>
        </div>
      </div>
    </article>
    <article class="col-sm-6 col-lg-3">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body p-4">
          <p class="eyebrow text-coral mb-1">LEVEL</p>
          <div class="d-flex align-items-baseline justify-content-between gap-2">
            <h2 class="h4 mb-0">Lv. <span th:text="${user.level}">1</span></h2>
            <strong class="small"><span th:text="${user.experience}">1000</span> XP</strong>
          </div>
          <div class="progress mt-3" style="height: .5rem;" role="progressbar"
               aria-label="다음 레벨까지 진행"
               th:attr="aria-valuenow=${user.levelProgress}, aria-valuemin=0, aria-valuemax=${user.experiencePerLevel}">
            <div class="progress-bar bg-success" th:style="|width: ${user.levelProgressPercent}%|"></div>
          </div>
          <p class="small text-secondary mt-2 mb-1">
            <span th:text="${user.levelProgress}">0</span> /
            <span th:text="${user.experiencePerLevel}">1000</span> XP
          </p>
          <p class="small text-secondary mb-0">
            다음 레벨까지 <strong th:text="${user.experienceToNextLevel}">1000</strong> XP
            <br><span>승리 +500 XP · 패배 +100 XP</span>
          </p>
        </div>
      </div>
    </article>
  </section>

</main>

<script src="/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/user-level.js}"></script>
</body>
</html>
