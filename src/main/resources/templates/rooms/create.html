<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 방 만들기 | MAFIAGAME</title>
  <link rel="stylesheet" th:href="@{/css/rooms.css}">
</head>
<body class="detail-body">
<main class="lobby-shell">
  <header class="topbar">
    <a class="brand" href="/rooms" aria-label="마피아 게임 로비 홈">
      <span class="brand-mark">M</span>
      <span>MAFIA<span>GAME</span></span>
    </a>
    <nav class="auth-links" aria-label="계정 메뉴">
      <span sec:authorize="isAuthenticated()"><span sec:authentication="principal.nickname"></span>님</span>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <button class="logout-button" type="submit">로그아웃</button>
      </form>
    </nav>
  </header>

  <a class="back" href="/rooms">← 게임 목록으로</a>
  <section class="room-create-shell">
    <div class="room-create-copy">
      <p class="eyebrow">CREATE ROOM</p>
      <h1>새로운 게임방을<br>만들어 보세요.</h1>
      <p>방을 만든 뒤 친구를 초대하고, 모두 준비되면 게임을 시작할 수 있어요.</p>
    </div>
    <form class="room-form" th:action="@{/rooms}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <p class="alert" th:if="${roomError}" th:text="${roomError}">입력값을 확인해 주세요.</p>

      <label for="title">방 제목
        <input id="title" type="text" name="title" th:value="${title}"
               placeholder="예: 초보 환영 달빛 마피아" minlength="2" maxlength="100" required autofocus>
      </label>

      <fieldset>
        <legend>최대 인원</legend>
        <div class="capacity-options">
          <label th:each="capacity : ${#numbers.sequence(4, 8)}">
            <input type="radio" name="maxPlayers" th:value="${capacity}"
                   th:checked="${maxPlayers == capacity}" required>
            <span th:text="${capacity + '명'}">8명</span>
          </label>
        </div>
        <small class="field-help">마피아 게임은 4~8명으로 진행할 수 있어요.</small>
      </fieldset>

      <label class="private-toggle" for="privateRoom">
        <input id="privateRoom" type="checkbox" th:checked="${hasPassword}">
        <span>비밀번호로 방 보호하기</span>
      </label>
      <div class="password-field" id="passwordField" th:classappend="${hasPassword} ? ' is-visible' : ''">
        <label for="password">방 비밀번호
          <input id="password" type="password" name="password" minlength="4" maxlength="20"
                 placeholder="4~20자" th:disabled="${!hasPassword}">
        </label>
      </div>

      <button class="ready room-submit" type="submit">방 만들기</button>
      <a class="cancel-room" href="/rooms">취소</a>
    </form>
  </section>
</main>
<script>
  const privateRoom = document.querySelector('#privateRoom');
  const passwordField = document.querySelector('#passwordField');
  const password = document.querySelector('#password');
  function updatePasswordField() {
    const enabled = privateRoom.checked;
    passwordField.classList.toggle('is-visible', enabled);
    password.disabled = !enabled;
    password.required = enabled;
    if (!enabled) password.value = '';
  }
  privateRoom.addEventListener('change', updatePasswordField);
  updatePasswordField();
</script>
</body>
</html>
